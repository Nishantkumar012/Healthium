version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: healthum-postgres
    environment:
      POSTGRES_DB: healthum
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - healthum-network

  redis:
    image: redis:7-alpine
    container_name: healthum-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - healthum-network

  adminer:
    image: adminer:latest
    container_name: healthum-adminer
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    networks:
      - healthum-network

  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: healthum-redis-commander
    environment:
      - REDIS_HOSTS=local:redis:6379
    ports:
      - "8081:8081"
    depends_on:
      - redis
    networks:
      - healthum-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  healthum-network:
    driver: bridge
